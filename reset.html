<p id="msg"></p>

var URL_="https://agxfdlpibyaieqlthpwd.supabase.co",KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFneGZkbHBpYnlhaWVxbHRocHdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM2NDkwNjMsImV4cCI6MjEwOTIyNTA2M30.TQl8n2pzS54ewOD0z2NR4lZjNoCNQstnqXvFUp_MoK8";
